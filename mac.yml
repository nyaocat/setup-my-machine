---
- name: set up my machine
  hosts: localhost
  connection: local
  tasks:
    - name: install packages
      community.general.homebrew:
        update_homebrew: true
        upgrade_all: true
        name:
          - ansible
          - awscli
          - bash
          - claude-code
          - cmake
          - duckdb
          - eza
          - ffmpeg
          - gemini-cli
          - genact
          - gh
          - glow
          - gnu-sed
          - gnu-tar
          - google-japanese-ime
          - grep
          - jq
          - mise
          - moreutils
          - ngrok
          - obsidian
          - pkgconf
          - postgresql@16
          - restic
          - slack
          - tig
          - tmux
          - vips
          - visual-studio-code
          - vlc
          - webp
          - zoxide
          - zsh-autosuggestions
          - zsh-completions
          - zsh-syntax-highlighting
          - difftastic
          - ast-grep
          - fd
          - sd
          - scc
          - yq
          - rancher
          - linear
          - ripgrep
          - bat
          - fzf
          - git-delta
          - gron
          - tealdeer
          - hyperfine
          - dust
          - duf
          - procs
          - bottom
          - choose-rust
          - miller
          - qsv
          - ripgrep-all
          - just
          - watchexec
          - atuin
          - xh
          - zed
          - activitywatch

    - name: remove packages
      community.general.homebrew:
        name:
          - peco
        state: absent

    # tealdeer 1.8.1 の `tldr --update` は同梱ルート証明書が古く
    # release-assets.githubusercontent.com の Let's Encrypt チェーンを
    # UnknownIssuer で弾くため、アーカイブを直接展開する。
    # 更新したいときは pages.en ごと消してから再実行する。
    - name: check tldr cache
      stat:
        path: ~/Library/Caches/tealdeer/tldr-pages/pages.en/common
      register: rc_tldr_cache

    - name: install tldr pages
      when: not rc_tldr_cache.stat.exists
      block:
        - name: prepare tldr cache directory
          ansible.builtin.file:
            path: ~/Library/Caches/tealdeer/tldr-pages/pages.en
            state: directory

        - name: unarchive tldr pages
          ansible.builtin.unarchive:
            src: "https://github.com/tldr-pages/tldr/releases/latest/download/tldr-pages.en.zip"
            dest: ~/Library/Caches/tealdeer/tldr-pages/pages.en
            remote_src: yes

    - name: check pg_bigm.so
      stat:
        path: /opt/homebrew/opt/postgresql@16/lib/postgresql/pg_bigm.dylib
      register: rc_pg_bigm

    - name: install pg_bigm
      when: not rc_pg_bigm.stat.exists
      block:
        - name: prepare temporary directory for pg_bigm build
          ansible.builtin.tempfile:
            state: directory
          register: rc_tempdir

        - name: unarchive pg_bigm
          ansible.builtin.unarchive:
            src: "https://github.com/pgbigm/pg_bigm/archive/refs/tags/v1.2-20250903.tar.gz"
            dest: "{{ rc_tempdir.path }}"
            remote_src: yes

        - name: build pg_bigm
          ansible.builtin.command:
            cmd: "make USE_PGXS=1 PG_CONFIG=/opt/homebrew/opt/postgresql@16/bin/pg_config"
            chdir: "{{ rc_tempdir.path }}/pg_bigm-1.2-20250903"

        - name: install pg_bigm
          ansible.builtin.command:
            cmd: "make USE_PGXS=1 PG_CONFIG=/opt/homebrew/opt/postgresql@16/bin/pg_config install"
            chdir: "{{ rc_tempdir.path }}/pg_bigm-1.2-20250903"

        - name: clean up tmeporary directory
          ansible.builtin.file:
            path: "{{ rc_tempdir.path }}"
            state: absent

    - name: start postgresql
      community.general.homebrew_services:
        name: postgresql@16
        state: "{{ 'present' if rc_pg_bigm.stat.exists else 'restarted' }}"

    - name: add ActivityWatch to login items
      ansible.builtin.shell: |
        osascript -e 'tell application "System Events"
          if not (exists login item "ActivityWatch") then
            make login item at end with properties {path:"/Applications/ActivityWatch.app", hidden:true}
            return "added"
          end if
        end tell'
      register: rc_aw_login_item
      changed_when: rc_aw_login_item.stdout == "added"

    - name: prepare git, mise and claude config directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop:
        - ~/.config/mise
        - ~/.config/git
        - ~/.claude

    - name: copy files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
      loop:
        - src: assets/mac/bash_profile
          dest: ~/.bash_profile
        - src: assets/mac/zshrc
          dest: ~/.zshrc
        - src: assets/mac/zprofile
          dest: ~/.zprofile
        - src: assets/tmux.conf
          dest: ~/.tmux.conf
        - src: assets/gitignore
          dest: ~/.config/git/ignore
        - src: assets/mac/gitconfig
          dest: ~/.gitconfig
        - src: assets/mac/CLAUDE.md
          dest: ~/.claude/CLAUDE.md

    - name: copy mise config file
      ansible.builtin.copy:
        src: assets/mise.config.toml
        dest: ~/.config/mise/config.toml
      register: rc_copy_mise_config

    - name: install mise
      ansible.builtin.command:
        cmd: mise install
      when: rc_copy_mise_config.changed

    # nyaochute: 開発用 ~/project/nyaochute とは別に checkout してビルドし、
    # launchd で 127.0.0.1:8082 に常駐させる (8081 は mise run dev が使う)。
    - name: checkout nyaochute
      tags: nyaochute
      ansible.builtin.git:
        repo: git@github.com:nyaocat/nyaochute.git
        dest: ~/.local/src/nyaochute
      register: rc_nyaochute_git

    - name: check nyaochute binary
      tags: nyaochute
      stat:
        path: ~/.local/src/nyaochute/dist/nyaochute
      register: rc_nyaochute_bin

    - name: build nyaochute
      tags: nyaochute
      when: rc_nyaochute_git.changed or not rc_nyaochute_bin.stat.exists
      ansible.builtin.shell: |
        mise trust && mise install && mise exec -- pnpm -C web install --frozen-lockfile && mise run build
      args:
        chdir: ~/.local/src/nyaochute
      environment:
        CI: "true"
      register: rc_nyaochute_build

    - name: install nyaochute launch agent
      tags: nyaochute
      ansible.builtin.copy:
        dest: ~/Library/LaunchAgents/com.github.nyaocat.nyaochute.plist
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Label</key><string>com.github.nyaocat.nyaochute</string>
            <key>ProgramArguments</key>
            <array>
              <string>{{ ansible_facts.env.HOME }}/.local/src/nyaochute/dist/nyaochute</string>
              <string>-addr</string><string>127.0.0.1:8082</string>
              <string>-data</string><string>{{ ansible_facts.env.HOME }}/Library/Application Support/nyaochute</string>
            </array>
            <key>RunAtLoad</key><true/>
            <key>KeepAlive</key><true/>
            <key>StandardErrorPath</key><string>{{ ansible_facts.env.HOME }}/Library/Logs/nyaochute.log</string>
          </dict>
          </plist>
      register: rc_nyaochute_plist

    - name: (re)start nyaochute
      tags: nyaochute
      when: rc_nyaochute_plist.changed or rc_nyaochute_build.changed
      ansible.builtin.shell: |
        launchctl bootout gui/$(id -u)/com.github.nyaocat.nyaochute 2>/dev/null || true
        # bootout は非同期なので消えるまで待たないと bootstrap が EIO で落ちる
        while launchctl print gui/$(id -u)/com.github.nyaocat.nyaochute >/dev/null 2>&1; do sleep 0.1; done
        launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/com.github.nyaocat.nyaochute.plist

    - name: Clean up downloads directory
      ansible.builtin.shell: "rm -rf ~/Downloads/*"
